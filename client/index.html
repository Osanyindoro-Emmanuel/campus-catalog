<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('mbw_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>Mide's Beauty World | UNIMAID Campus Boutique</title>
    <meta name="description" content="Shop Curated Unisex Streetwear, Chunky Kicks, Bags & Accessories. Fast Hostel & Campus Gate Delivery!" />

    <!-- Open Graph / WhatsApp Status Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mide's Beauty World | UNIMAID Campus Boutique" />
    <meta property="og:description" content="Shop Curated Unisex Streetwear, Chunky Kicks, Bags & Accessories. Fast Hostel & Campus Gate Delivery!" />
    <meta property="og:image" content="/og-cover.jpg" />
    <meta property="og:site_name" content="Mide's Beauty World" />

    <!-- Twitter / X Card -->

    <meta name="twitter:image" content="/og-cover.jpg" />
